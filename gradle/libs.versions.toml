[versions]
# Version stamped into the jar by Gradle and asserted against AllAddons.VERSION by tools/check_version.py
mod-version = "1.0.0"

# Java / Minecraft - must match the Meteor Client build we compile against
jdk = "25"
minecraft = "26.3"
fabric-loader = "0.19.5"

# Gradle plugins
loom = "1.18-SNAPSHOT"

# Meteor Client
meteor = "26.3-SNAPSHOT"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
meteor-client = { module = "meteordevelopment:meteor-client", version.ref = "meteor" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
